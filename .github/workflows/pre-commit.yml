name: C++ CMake Conan Pre-Commit

on:
  workflow_call:
    inputs:
      # A self-hosted runner label to run on instead of hosted Linux; empty for hosted.
      runner:
        type: string
        default: ''

jobs:
  pre-commit:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 3.14, not 3.x: the cmake-format hook (cmakelang 0.6.13, unmaintained since 2020)
          # builds its lexer from capturing-group patterns that CPython 3.15's re.Scanner rejects.
          python-version: "3.14"

      - name: Run pre-commit
        if: hashFiles('.pre-commit-config.yaml') != ''
        uses: pre-commit/action@v3.0.1