name: C++ CMake Conan Build

# The full health pipeline for ONE platform: pre-commit hygiene gates everything, build+test and
# lint run in parallel behind it, and on pushes the release job attaches this platform's packages
# to each product's release shared by the project's per-platform caller workflows.
#
# Projects declare one tiny caller workflow per OS, each invoking this with a different `os` —
# that gives every platform its own README badge, and a future Windows-only project simply
# declares a single caller. Platforms know nothing about each other: each independently upserts
# its installers into the shared draft release as it finishes (see the release job below).

on:
  workflow_call:
    inputs:
      # Runner image for this platform (e.g. windows-latest).
      os:
        type: string
        required: true
      # The CMake preset that configures, builds and tests (its build and test presets carry the
      # same name) and whose build tree, build/<preset>, holds every product's CPack configuration.
      # Lint always runs on the `release` preset.
      configure-preset:
        type: string
        default: release
      # The products the build tree packages and releases, as a JSON array of
      # {"cpack-config": ..., "tag-prefix": ...} entries. A product is packaged by
      # `cpack --config build/<preset>/<cpack-config>` and has releases of its own: its
      # <tag-prefix>v<SemVer> tags publish it and its dev build lives at <tag-prefix>dev-build.
      # The tag prefix is the product's identity, so it also names the product's packages folder:
      # it holds only letters, digits, '-' and '_', and no two differ only in case. CPack
      # configurations are unique too. The default is the one package of a tree whose top-level
      # project packages.
      products:
        type: string
        default: '[{"cpack-config": "CPackConfig.cmake", "tag-prefix": ""}]'
      # Every pipeline stage below is opt-in (default false) so a caller workflow reads as the
      # project's complete CI manifest and new stages never silently change existing consumers.
      install-juce-dependencies:
        type: boolean
        default: false
      # Run clang-tidy as part of this platform's health. Off only for projects with no C++
      # lint surface (e.g. pure CMake tooling).
      lint:
        type: boolean
        default: false
      # Validate `conan create` of this repo's package after the build. On for library projects
      # consumed through Conan.
      test-package:
        type: boolean
        default: false
      # Publish the shared GitHub releases: every product's dev build on master pushes, and the one
      # product a release tag names on tag pushes.
      # Off for projects that want build health without automatic release publication.
      release:
        type: boolean
        default: false
      # Whether this platform packages installers for the release; without it the project
      # publishes source-only releases. Declaration and reality must agree in BOTH directions,
      # checked per product by the Package step: a declared product's CPack configuration must
      # exist, and an undeclared one's must not (so forgetting this flag cannot silently publish
      # thinner releases).
      package:
        type: boolean
        default: false

env:
  # Artifact names are unique per workflow run, and a caller may call this for several platforms
  # from one workflow, so each call's artifacts carry its platform.
  ARTIFACT_SUFFIX: ${{ inputs.os }}

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  build:
    needs: pre-commit
    runs-on: ${{ inputs.os }}

    env:
      # project-config's binaryDir rule, build/${presetName}.
      BUILD_DIR: build/${{ inputs.configure-preset }}

    steps:
      # The one check of the products input, before any build time is spent; the package and
      # release steps read it trusting this. -j prints no newline, which jq on Windows would
      # write as CRLF.
      - name: Validate products
        env:
          PRODUCTS: ${{ inputs.products }}
        shell: bash
        run: |
          if ! problem="$(jq -j '
              if type != "array" or length == 0 then "must be a non-empty array"
              elif any(.[]; type != "object" or (.["cpack-config"] | type) != "string"
                  or (.["tag-prefix"] | type) != "string")
                then "entries must each hold a string cpack-config and tag-prefix"
              elif any(.[]; .["cpack-config"] == "") then "entries must each name a cpack-config"
              elif any(.[]; .["tag-prefix"] | test("^[A-Za-z0-9_-]*$") | not)
                then "tag prefixes may hold only letters, digits, - and _"
              elif (map(.["cpack-config"]) | unique | length) != length
                then "cpack-configs must be unique"
              elif (map(.["tag-prefix"] | ascii_downcase) | unique | length) != length
                then "tag prefixes must be unique, ignoring case"
              else empty end' <<<"$PRODUCTS")"; then
            echo "error: products is not valid JSON: $PRODUCTS" >&2
            exit 1
          fi
          if [[ -n "$problem" ]]; then
            echo "error: products ${problem}: $PRODUCTS" >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bootstrap this repo's own tooling from the repository and at the exact commit this
      # reusable workflow resolved to, so a fork bootstraps itself, a pinned consumer is frozen
      # end-to-end, and releases need no ref rewriting. The sentinel fallbacks make checkout fail
      # loudly if the context is ever empty (an empty repository would silently check out the
      # caller, an empty ref the default branch), and the source checkout must come first:
      # checking out into a not-yet-a-repo directory wipes it, tooling included.
      - name: Checkout ci-workflows tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || 'error-job-workflow-repository-unavailable' }}
          ref: ${{ job.workflow_sha || 'error-job-workflow-sha-unavailable' }}
          path: .ci-workflows

      # project-config's Conan provider gives each build tree its own Conan home.
      - name: Setup
        uses: ./.ci-workflows/.github/actions/cpp-cmake-conan-setup
        with:
          install-juce-dependencies: ${{ inputs.install-juce-dependencies }}
          conan-home: ${{ env.BUILD_DIR }}/.conan2

      - name: Configure
        run: cmake --preset ${{ inputs.configure-preset }}

      - name: Build
        run: cmake --build --preset ${{ inputs.configure-preset }}

      # Linux runs the tests under a virtual display: plain JUCE components work headless, but
      # window-class components (DocumentWindow and friends) need a real display connection and
      # segfault without one. A window manager must run inside that display: JUCE writes the
      # WM_PROTOCOLS window property with an atom it looks up only-if-exists, and on a bare Xvfb
      # server nothing has interned the ICCCM/EWMH atoms, so window creation dies with a fatal
      # X BadAtom. Any EWMH window manager interns them all at startup; openbox is the smallest.
      # macOS and Windows runners provide a session-level display already.
      - name: Test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get install -y xvfb openbox
            xvfb-run --auto-servernum bash -c \
              'openbox --sm-disable & sleep 1; ctest --preset ${{ inputs.configure-preset }} --output-on-failure'
          else
            ctest --preset ${{ inputs.configure-preset }} --output-on-failure
          fi

      # Each product's packages stage under a short runner-temp base instead of the deep build
      # tree: NSIS's makensis carries no longPathAware manifest, so every staged file path must
      # stay under MAX_PATH (260) on Windows, and generated docs carry filenames long enough to
      # overflow from a deep base. The packages then move to the folder named by the product's tag
      # prefix, outside that budget. The pre-check turns future growth into a readable failure
      # here, and a packaging failure prints NSISOutput.log so the real error is never hidden.
      - name: Package
        env:
          PRODUCTS: ${{ inputs.products }}
          WITH_PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          # Each product's CPack configuration exists exactly when packaging is declared. tr drops
          # the CR that jq on Windows writes before each newline.
          configs=()
          prefixes=()
          while IFS= read -r config && IFS= read -r prefix; do
            config="${BUILD_DIR}/${config}"
            if [[ -f "$config" ]]; then exists=true; else exists=false; fi
            if [[ "$exists" != "$WITH_PACKAGE" ]]; then
              echo "error: \`package: ${WITH_PACKAGE}\` is declared, but the CPack configuration" \
                   "${config} $([[ "$exists" == true ]] && echo exists || echo 'does not exist')." >&2
              exit 1
            fi
            configs+=("$config")
            prefixes+=("$prefix")
          done < <(jq -r '.[] | .["cpack-config"], .["tag-prefix"]' <<<"$PRODUCTS" | tr -d '\r')
          if [[ "$WITH_PACKAGE" != "true" ]]; then
            echo "No packaging declared."
            exit 0
          fi

          package_dir="${RUNNER_TEMP//\\//}/pkg"
          packages_dir="${RUNNER_TEMP//\\//}/packages"

          # ~110 chars of the 260 budget go to the staging skeleton under the short base
          # (installer name, component, the docs' install folders); fail with headroom left.
          if [[ -d "${BUILD_DIR}/docs" ]]; then
            # awk reads every name: a reader that quits early, like head, breaks the pipe under
            # pipefail once the listing outgrows the pipe's buffer.
            longest=$(find "${BUILD_DIR}/docs" -type f | sed 's|.*/||' | awk 'length > max { max = length } END { print max + 0 }')
            if (( longest > 145 )); then
              echo "error: longest generated docs filename is ${longest} chars; staged NSIS" \
                   "paths would exceed MAX_PATH (makensis is not long-path aware). Shorten" \
                   "generated names or stop installing the docs tree."
              exit 1
            fi
          fi

          for i in "${!configs[@]}"; do
            if ! cpack --config "${configs[i]}" -B "${package_dir}"; then
              find "${package_dir}" -name 'NSISOutput.log' -exec echo '--- {} ---' \; -exec cat '{}' \; || true
              exit 1
            fi
            rm -rf "${package_dir}/_CPack_Packages"
            mkdir -p "${packages_dir}/${prefixes[i]}"
            mv "${package_dir}"/* "${packages_dir}/${prefixes[i]}/"
          done

      - name: Upload Conan host profile
        uses: actions/upload-artifact@v4
        with:
          name: conan-profile-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ env.BUILD_DIR }}/conan_host_profile

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: ignore

  lint:
    if: inputs.lint
    needs: pre-commit
    runs-on: ${{ inputs.os }}

    env:
      # One exact LLVM release on every platform, installed from LLVM's own release archives:
      # Homebrew and apt.llvm.org serve only the newest patch of a major and Chocolatey lags
      # upstream, so none of them can hold the lint baseline still. Bump deliberately, in step
      # with the developers' local toolchain and the clang-format rev in consumers'
      # .pre-commit-config.yaml; the verify step fails on any drift.
      LLVM_VERSION: "23.1.4"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tooling bootstrap at this workflow's own commit — see the build job for the rationale.
      - name: Checkout ci-workflows tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || 'error-job-workflow-repository-unavailable' }}
          ref: ${{ job.workflow_sha || 'error-job-workflow-sha-unavailable' }}
          path: .ci-workflows

      - name: Setup
        uses: ./.ci-workflows/.github/actions/cpp-cmake-conan-setup
        with:
          install-juce-dependencies: ${{ inputs.install-juce-dependencies }}

      # Prepended to PATH, so it shadows any LLVM the runner image preinstalls. The compiler stays
      # the platform default (MSVC on Windows, CC/CXX pinned in the setup action) — this install
      # only provides clang-tidy.
      - name: Install clang-tidy
        shell: bash
        run: |
          set -euo pipefail
          exe=""
          case "$RUNNER_OS" in
            Linux)   asset="LLVM-$LLVM_VERSION-Linux-X64.tar.xz" ;;
            macOS)   asset="LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz" ;;
            Windows) asset="clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"; exe=".exe" ;;
            *) echo "error: unsupported runner OS $RUNNER_OS" >&2; exit 1 ;;
          esac
          top="${asset%.tar.xz}"
          llvm_dir="${RUNNER_TEMP//\\//}/llvm"
          mkdir -p "$llvm_dir"
          # Relative paths from inside the directory: Git Bash's GNU tar reads a `C:/...` archive
          # path as a remote host.
          cd "$llvm_dir"
          curl -fsSL --retry 3 -o "$asset" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$asset"
          # Only what the lint target runs: the whole archive unpacks to over 12 GB on Linux, which
          # with the archive beside it exhausts a hosted runner's disk. clang-tidy links LLVM
          # statically; lib/clang holds the builtin headers it parses against. Exact member paths,
          # not wildcards, so GNU tar (Linux, Git Bash) and bsdtar (macOS) read them alike.
          tar -xJf "$asset" --strip-components=1 \
            "$top/bin/clang-tidy$exe" "$top/bin/run-clang-tidy" "$top/lib/clang"
          rm "$asset"
          echo "$llvm_dir/bin" >> "$GITHUB_PATH"

      - name: Verify clang-tidy
        shell: bash
        run: |
          clang-tidy --version
          command -v run-clang-tidy
          installed="$(clang-tidy --version | grep -oE 'version [0-9]+(\.[0-9]+)+' | cut -d' ' -f2)"
          if [[ "$installed" != "$LLVM_VERSION" ]]; then
            echo "error: clang-tidy $installed does not match the exact pinned" \
                 "LLVM_VERSION $LLVM_VERSION; the lint baseline must not drift silently." >&2
            exit 1
          fi

      - name: Configure
        run: cmake --preset release

      - name: Lint
        run: cmake --build --preset release --target clang-tidy

  test-package:
    if: inputs.test-package
    needs: build
    # CONAN_HOME is exported by the setup action, so conan profile detect / conan create below
    # already target the cached Conan home without a job-level duplicate of the path.
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Tooling bootstrap at this workflow's own commit — see the build job for the rationale.
      - name: Checkout ci-workflows tooling
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || 'error-job-workflow-repository-unavailable' }}
          ref: ${{ job.workflow_sha || 'error-job-workflow-sha-unavailable' }}
          path: .ci-workflows

      - name: Setup
        uses: ./.ci-workflows/.github/actions/cpp-cmake-conan-setup
        with:
          install-juce-dependencies: ${{ inputs.install-juce-dependencies }}

      - name: Download Conan host profile
        uses: actions/download-artifact@v4
        with:
          name: conan-profile-${{ env.ARTIFACT_SUFFIX }}

      - name: Detect default profile
        run: conan profile detect

      - name: Create package
        run: conan create . --version=test --build=missing --profile:host=./conan_host_profile

  # Attaches this platform's packages to each released product's DRAFT release, shared by the
  # project's per-platform workflows, so each OS gets its own badge while every push still yields
  # a single GitHub release per product holding every platform's installers.
  #
  # The platforms are deliberately uncoordinated: releases stay drafts and nothing here decides
  # "all platforms are in" — a human publishes tagged releases after review (and dev-build
  # drafts simply track master for maintainers). Asset names are distinct per platform, so each
  # build independently upserts its own files as it finishes. The two races that remain are
  # handled locally with a retry loop:
  #   - Draft releases do not reserve tag names, so simultaneous first-arrivals can create
  #     duplicate drafts; each pass keeps the oldest and deletes the extras.
  #   - A dev-build draft left by an earlier commit is superseded wholesale (delete + recreate),
  #     detected by comparing the release's target commitish to this run's SHA. Caller-side
  #     cancel-in-progress concurrency keeps stale runs from resurrecting an old SHA.
  #
  # `!cancelled()` disables the implicit all-needs-succeeded gate so that lint/test-package jobs
  # skipped BY CONFIGURATION don't skip the release; the explicit result checks then re-impose
  # "everything must have passed or been configured off". A job skipped because pre-commit failed
  # drags build with it, and a job that never ran — 'cancelled', as when no hosted runner picks it
  # up — blocks the release instead of letting untested packages through.
  release:
    if: >-
      inputs.release && github.event_name == 'push' && !cancelled() &&
      needs.build.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.lint.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.test-package.result)
    needs: [build, lint, test-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # This call's artifact only, by a pattern rather than `name`: a missing artifact then reaches
      # the readable error below instead of failing the download.
      - name: Download package artifacts from this call
        if: inputs.package
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/packages
          pattern: packages-${{ env.ARTIFACT_SUFFIX }}
          merge-multiple: true

      - name: Attach assets to the shared releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRODUCTS: ${{ inputs.products }}
          WITH_PACKAGE: ${{ inputs.package }}
        shell: bash
        run: |
          set -euo pipefail

          sha="$GITHUB_SHA"

          # The products this push releases, each with its release tag. A master push refreshes
          # every product's dev build. A release tag is <prefix>v<SemVer>, pre-release included
          # (PackageBuilder's package_create(VERSION) accepts the same suffix), and names exactly
          # one product; build metadata ('+') stays out of tags, where it is unusable in a release
          # URL. The quoted prefix matches literally.
          prefixes=()
          tags=()
          # Empty for the dev build, which names no version.
          version=""
          prerelease=false
          while IFS= read -r prefix; do
            if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
              prefixes+=("$prefix")
              tags+=("${prefix}dev-build")
            elif [[ "$GITHUB_REF" =~ ^refs/tags/"$prefix"v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              prefixes+=("$prefix")
              tags+=("${GITHUB_REF#refs/tags/}")
              version="${BASH_REMATCH[1]}"
              if [[ "${BASH_REMATCH[2]}" ]]; then
                prerelease=true
              fi
            fi
          done < <(jq -r '.[] | .["tag-prefix"]' <<<"$PRODUCTS")
          if [[ "$GITHUB_REF" == refs/tags/* ]] && (( ${#tags[@]} != 1 )); then
            echo "error: tag ${GITHUB_REF#refs/tags/} is the <tag-prefix>v<SemVer> of" \
                 "${#tags[@]} products; a release tag must name exactly one." >&2
            exit 1
          fi
          if (( ${#tags[@]} == 0 )); then
            echo "$GITHUB_REF publishes no release."
            exit 0
          fi

          shopt -s nullglob

          # All releases sharing our tag name (drafts included), oldest first.
          list_releases() {
            gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$tag\")] | sort_by(.id)"
          }

          for i in "${!tags[@]}"; do
            tag="${tags[i]}"

            # The Package step proved each declared product's configuration exists; its packages
            # must have reached this job too.
            asset_files=()
            if [[ "$WITH_PACKAGE" == "true" ]]; then
              for file in "$RUNNER_TEMP/packages/${prefixes[i]}"/*; do
                [[ -f "$file" ]] && asset_files+=("$file")
              done
              if (( ${#asset_files[@]} == 0 )); then
                echo "error: this platform expects package files for release $tag but the run" \
                     "uploaded none." >&2
                exit 1
              fi
            fi

            # A versioned release must ship what its tag names: PackageBuilder names every
            # installer <project>-<version>-<os>-<arch>.<ext>, so the version must sit exactly in
            # that slot (a v1.0.0 tag must not pass for a 1.0.0-alpha installer).
            if [[ -n "$version" ]]; then
              # "." is the only regex metacharacter the tag grammar above admits.
              version_re="${version//./[.]}"
              for file in "${asset_files[@]}"; do
                name="$(basename "$file")"
                if [[ ! "$name" =~ ^.+-${version_re}-[a-z]+-[a-z0-9_]+\. ]]; then
                  echo "error: tag $tag does not name the version packaged as $name." >&2
                  exit 1
                fi
              done
            fi

            for attempt in $(seq 1 8); do
              (( attempt > 1 )) && sleep "$attempt"
              releases="$(list_releases)"
              count="$(jq 'length' <<<"$releases")"

              if (( count == 0 )); then
                flags=(--draft --title "$tag")
                if [[ -z "$version" ]]; then
                  flags+=(--notes "Automated development build from commit $sha" --target "$sha")
                else
                  flags+=(--generate-notes)
                fi
                if [[ "$prerelease" == "true" ]]; then
                  flags+=(--prerelease)
                fi
                gh release create "$tag" "${flags[@]}" || true
                continue
              fi

              if (( count > 1 )); then
                for extra_id in $(jq -r '.[1:][].id' <<<"$releases"); do
                  gh api -X DELETE "repos/$GH_REPO/releases/$extra_id" || true
                done
                continue
              fi

              release_id="$(jq -r '.[0].id' <<<"$releases")"
              target="$(jq -r '.[0].target_commitish' <<<"$releases")"

              if [[ -z "$version" && "$target" != "$sha" ]]; then
                gh api -X DELETE "repos/$GH_REPO/releases/$release_id" || true
                gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag" 2>/dev/null || true
                continue
              fi

              if (( ${#asset_files[@]} == 0 )); then
                echo "Release $tag ready (source-only platform; nothing to attach)."
                continue 2
              fi
              if gh release upload "$tag" "${asset_files[@]}" --clobber; then
                echo "Attached ${#asset_files[@]} file(s) to release $tag."
                continue 2
              fi
            done

            echo "error: could not attach assets to release $tag after 8 attempts." >&2
            exit 1
          done
